<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <label for="name"> Name: </label>
<input
type="text"
id="name"
name="name" required>

<br>

<label for="email"> Email: </label>
<input
type="text"
id="email"
name="email" required>

<br>

<label for="password"> Password: </label>
<input
type="password"
id="password"
name="password" required>

<br>

<label for="date"> Date: </label>
<input 
type="date"
id="date"
name="date">

<br>

<label for="phone"> Phone Number: </label>
<input
type="tel"
id="phone"
name="phone">

<br>

<p> Year: </p>
<label>
    <input
    type="radio"
    name="year"
    value="1">
    First Year
</label>

<label>
    <input
    type="radio"
    name="year"
    value="2">
    Secong Year
</label>

<br>

<p> Skills: </p>
<label> 
    <input 
    type="checkbox"
    name="skills"
    value="html">
    HTML
</label>

<label> 
    <input
    type="checkbox"
    name="skills"
    value="CSS">
    CSS
</label>

<label>
    <input 
    type="checkbox"
    name="skills"
    value="java">
    JAVA
</label>

<br>

<label for="feedback"> Feedback: </label>
<textarea>
    id="message"
    name="message"
    row="5"
    column="33">
</textarea>

<br>

<button type="submit"> SUBMIT</button>

</body>
</html>
